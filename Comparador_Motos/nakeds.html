<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MotoVersus</title>
    <link rel="stylesheet" href="nakeds.css" />
  </head>
  <body>
    <!-- Este es el encabezado que estara igual por todos lados -->
    <header class="cabecera">
      <h1 class="logo">Moto<span>Versus</span></h1>
      <nav>
        <a href="index.html">Inicio</a>
        <a href="contacto.html">Contacto</a>
        <a>Registrarse</a>
        <img src="../IMagenes/usuario.png" class="usuario" alt="Icono de usuario"></img>
      </nav>
    </header>
    <!-- La estructura del articulo es imagen con el nombre y un botos en el que puedes reelegir una moto por si quieres escoger otra -->
    <article class="articulo">
      <div class="tarjeta">
        <img>imagen1</img>
        <h1>nombre1</h1>
        <a>boton1</a>
      </div>
      <div class="grafico">Grafico comparativo</div>
      <div class="tarjeta">
        <img>foto2<img>
        <h1>nombre2</h1>
        <a>boton2</a>
      </div>
    </article>
    <article>
      <!-- Aqui van los desplegables que son un sumarry con un -->
       <details class="detalles">
         <summary>Detalles objetivos</summary>
         <div class="comparador"></div>
          <table>Tiene 600cc</table>
      </details>
      <details class="detalles">
         <summary>Detalles subjetivos</summary>
         <div class="comparador"></div>
          <table>Es comoda</table>
      </details>
    </article>

  </body>
